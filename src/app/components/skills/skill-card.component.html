<article class="sk-card h-full" [style.--p]="skill().proficiency / 100">
  <app-icon class="tile-deco" [name]="icon().symbol" [brand]="icon().brand" />
  <div class="flex items-baseline justify-between gap-2">
    <h3 class="min-w-0 text-[15px] font-semibold leading-snug" style="overflow-wrap: anywhere">{{ skill().name }}</h3>
    <span class="mono text-[13px] font-semibold" style="color: var(--int-xp-ink)">{{ skill().proficiency }}</span>
  </div>
  <p class="tile-sub mt-0.5">{{ i18n.t('category.' + skill().category.toLowerCase()) }}</p>
  <div
    class="sk-meter"
    role="meter"
    [attr.aria-valuenow]="skill().proficiency"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-label]="skill().name + ' — ' + i18n.t('skills.proficiency')"
  >
    <span class="sk-bar"></span>
  </div>
  <div class="tile-tags">
    @for (tag of skill().tags; track tag; let first = $first) {
      <span
        class="tile-tag"
        [style.background]="first ? 'var(--int-secondary-container)' : null"
        [style.color]="first ? 'var(--int-on-secondary-container)' : null"
        >{{ tag }}</span
      >
    }
  </div>
</article>
