<footer style="border-top: 1px solid var(--int-hair); background: var(--int-bg)">
  <div class="mx-auto flex max-w-6xl flex-col items-center gap-6 px-4 py-10 sm:flex-row sm:justify-between sm:px-6">
    <div class="flex items-center gap-3 text-center sm:text-left">
      <span class="brand-tile hidden sm:grid">SÖ</span>
      <div>
        <p class="font-extrabold tracking-tight">Salih Özdemir</p>
        <p class="mt-0.5 text-sm" style="color: var(--int-on-surface-variant)">{{ i18n.t('footer.role') }}</p>
      </div>
    </div>

    <!-- General social channels only — no legal links here by design. -->
    <div class="flex items-center gap-1">
      @for (s of socials(); track s.id) {
        <a
          [href]="s.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="s.label"
          class="icon-btn"
          appRipple
        >
          <i [class]="s.icon" class="text-lg"></i>
        </a>
      }
    </div>
  </div>

  <div style="border-top: 1px solid var(--int-hair)">
    <p class="mx-auto max-w-6xl px-4 py-4 text-center text-xs sm:px-6" style="color: var(--int-on-surface-variant)">
      © {{ year }} Salih-Can Özdemir. {{ i18n.t('footer.rights') }}
    </p>
  </div>
</footer>
