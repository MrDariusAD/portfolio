<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-3 px-4 sm:px-6">
    <!-- Brand -->
    <a href="#top" class="flex items-center gap-2.5" [attr.aria-label]="i18n.t('common.backToTop')">
      <span class="brand-tile">SÖ</span>
      <span class="hidden text-[17px] font-extrabold tracking-tight sm:block">Salih Özdemir</span>
    </a>

    <!-- Section nav with a travelling active pill -->
    <nav class="nav-track ml-auto hidden md:block" aria-label="Section navigation">
      <div class="nav-row" #navRow>
        @for (item of nav; track item.fragment) {
          <a
            class="nav-link"
            [href]="'#' + item.fragment"
            [attr.data-fragment]="item.fragment"
            [attr.aria-current]="active() === item.fragment ? 'location' : null"
            >{{ i18n.t(item.key) }}</a
          >
        }
      </div>
      <div class="nav-row nav-active" #navActive aria-hidden="true">
        @for (item of nav; track item.fragment) {
          <span class="nav-link">{{ i18n.t(item.key) }}</span>
        }
      </div>
    </nav>

    <!-- Actions: socials + language + theme -->
    <div class="ml-auto flex items-center gap-1 md:ml-2">
      @for (s of socials(); track s.id) {
        <a
          [href]="s.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="s.label"
          [pTooltip]="s.label"
          tooltipPosition="bottom"
          class="icon-btn hidden lg:grid"
          appRipple
        >
          <i [class]="s.icon" class="text-[17px]"></i>
        </a>
      }

      <span class="mx-1 hidden h-6 w-px bg-hairline lg:block"></span>

      <div
        class="lang-seg"
        [class.is-de]="i18n.lang() === 'de'"
        role="group"
        [attr.aria-label]="i18n.t('common.language')"
      >
        <span class="lang-pill" aria-hidden="true"></span>
        <button type="button" [attr.aria-pressed]="i18n.lang() === 'en'" (click)="i18n.set('en')">EN</button>
        <button type="button" [attr.aria-pressed]="i18n.lang() === 'de'" (click)="i18n.set('de')">DE</button>
      </div>

      <button
        type="button"
        class="icon-btn"
        appRipple
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? i18n.t('common.switchToLight') : i18n.t('common.switchToDark')"
        [pTooltip]="theme.isDark() ? i18n.t('common.lightMode') : i18n.t('common.darkMode')"
        tooltipPosition="bottom"
      >
        <app-icon name="dark_mode" class="theme-glyph" [class.is-off]="theme.isDark()" />
        <app-icon name="light_mode" class="theme-glyph" [class.is-off]="!theme.isDark()" />
      </button>
    </div>
  </div>
</header>
